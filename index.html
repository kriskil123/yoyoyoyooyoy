<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Pro VR Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.85); color: #fff;
            padding: 20px; border-radius: 12px; z-index: 10;
            max-width: 280px; border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .status-info { font-size: 0.9em; margin-bottom: 15px; }
        .status-ok { color: #4ade80; font-weight: bold; }
        .status-wait { color: #fbbf24; }
        .status-error { color: #f87171; }
        
        /* 파일 선택 버튼 스타일링 */
        .file-label {
            display: inline-block;
            background: #3b82f6; color: #fff;
            padding: 10px 16px; border-radius: 6px;
            cursor: pointer; text-align: center;
            font-weight: bold; width: 100%; box-sizing: border-box;
            transition: background 0.2s;
        }
        .file-label:hover { background: #2563eb; }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 style="margin-top:0;">VR 모델 뷰어</h3>
        <div class="status-info">
            VR 상태: <span id="vr-status">대기 중</span><br>
            모델: <span id="model-status" class="status-wait">model.glb 확인 중...</span>
        </div>
        
        <!-- 다른 GLB 열기 버튼 -->
        <label for="file-input" class="file-label">📂 다른 GLB 파일 열기</label>
        <input type="file" id="file-input" accept=".glb,.gltf">
        
        <p style="font-size: 0.75em; color: #aaa; margin-top: 15px; line-height: 1.4;">
            * model.glb가 폴더에 있으면 자동으로 실행됩니다.<br>
            * WebXR(VR) 접속을 위해 HTTPS 환경이 권장됩니다.
        </p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 요소 참조
        const vrStatusEl = document.getElementById('vr-status');
        const modelStatusEl = document.getElementById('model-status');
        const fileInput = document.getElementById('file-input');

        // 기본 씬 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 500);
        camera.position.set(0, 1.6, 3); // 초기 카메라 위치 (눈높이)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true; // WebXR 활성화
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 조명 설정
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // 환경 가이드 (그리드)
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(grid);

        const loader = new GLTFLoader();
        let currentModel = null;

        // 모델 로딩 통합 함수
        function loadModel(url, isAuto = false) {
            // URL 유효성 검사
            try {
                new URL(url, window.location.href);
            } catch (e) {
                console.error("Invalid URL:", url);
                if (!isAuto) {
                    modelStatusEl.innerText = "잘못된 파일 경로입니다.";
                    modelStatusEl.className = "status-error";
                }
                return;
            }

            // 기존 모델 제거
            if (currentModel) {
                scene.remove(currentModel);
            }

            modelStatusEl.innerText = isAuto ? "model.glb 로딩 중..." : "파일 로딩 중...";
            modelStatusEl.className = "status-wait";

            loader.load(url, 
                (gltf) => {
                    currentModel = gltf.scene;
                    
                    // 크기 최적화 로직
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    if (maxDim > 10) {
                        const scale = 2 / maxDim; 
                        currentModel.scale.setScalar(scale);
                    } else if (maxDim < 0.01) {
                        currentModel.scale.setScalar(100); 
                    }
                    
                    const newBox = new THREE.Box3().setFromObject(currentModel);
                    const center = newBox.getCenter(new THREE.Vector3());
                    currentModel.position.x -= center.x;
                    currentModel.position.z -= center.z;
                    currentModel.position.y -= newBox.min.y; 
                    currentModel.position.z -= 2; 
                    
                    scene.add(currentModel);
                    
                    modelStatusEl.innerHTML = isAuto ? "model.glb 완료" : "로드 완료";
                    modelStatusEl.className = "status-ok";
                },
                undefined,
                (error) => {
                    console.warn("Load error:", error);
                    if (isAuto) {
                        modelStatusEl.innerText = "자동 로드 실패 (수동 선택 가능)";
                        modelStatusEl.className = "";
                    } else {
                        modelStatusEl.innerText = "파일 로드 에러";
                        modelStatusEl.className = "status-error";
                    }
                }
            );
        }

        // 1. 자동 실행: 절대 경로 구성을 시도하여 에러 방지
        try {
            // 현재 주소가 blob이거나 특수한 경우 상대 경로 생성이 실패할 수 있음
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const defaultModelUrl = new URL('model.glb', baseUrl).href;
            loadModel(defaultModelUrl, true);
        } catch (e) {
            console.log("자동 로드 경로 설정 실패. 수동 선택을 기다립니다.");
            modelStatusEl.innerText = "파일을 선택해주세요.";
        }

        // 2. 수동 실행: 파일 선택 시 이벤트
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                loadModel(url, false);
            }
        });

        // 애니메이션 루프
        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
            
            if (renderer.xr.isPresenting) {
                vrStatusEl.innerHTML = "<span class='status-ok'>연결됨 (VR 모드)</span>";
            } else {
                vrStatusEl.innerText = "대기 중";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
