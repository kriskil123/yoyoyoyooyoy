<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Pro VR Model Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.85); color: #fff;
            padding: 20px; border-radius: 12px; z-index: 10;
            max-width: 280px; border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .status-info { font-size: 0.9em; margin-bottom: 15px; }
        .status-ok { color: #4ade80; font-weight: bold; }
        .status-wait { color: #fbbf24; }
        .status-error { color: #f87171; }
        
        /* 파일 선택 버튼 스타일링 */
        .file-label {
            display: inline-block;
            background: #3b82f6; color: #fff;
            padding: 10px 16px; border-radius: 6px;
            cursor: pointer; text-align: center;
            font-weight: bold; width: 100%; box-sizing: border-box;
            transition: background 0.2s;
        }
        .file-label:hover { background: #2563eb; }
        #file-input { display: none; }

        #controls-hint {
            margin-top: 10px; font-size: 0.8em; color: #60a5fa;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h3 style="margin-top:0;">VR 모델 뷰어</h3>
        <div class="status-info">
            VR 상태: <span id="vr-status">대기 중</span><br>
            모델: <span id="model-status" class="status-wait">model.glb 확인 중...</span>
        </div>
        
        <label for="file-input" class="file-label">📂 다른 GLB 파일 열기</label>
        <input type="file" id="file-input" accept=".glb,.gltf">
        
        <div id="controls-hint">
            <strong>이동 방법:</strong><br>
            W/S: 앞뒤, A/D: 좌우<br>
            Q: 상승, E: 하강
        </div>

        <p style="font-size: 0.75em; color: #aaa; margin-top: 15px; line-height: 1.4;">
            * model.glb가 폴더에 있으면 자동으로 실행됩니다.<br>
            * WebXR(VR) 접속을 위해 HTTPS 환경이 권장됩니다.
        </p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 요소 참조
        const vrStatusEl = document.getElementById('vr-status');
        const modelStatusEl = document.getElementById('model-status');
        const fileInput = document.getElementById('file-input');

        // 기본 씬 설정
        const scene = new THREE.Scene();
        // 1. 하늘색 배경으로 변경 (Sky Blue)
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
        
        // 2. VR 이동을 위한 그룹 설정 (카메라를 그룹에 넣어 이동)
        const userGroup = new THREE.Group();
        userGroup.position.set(0, 0, 3); // 초기 위치
        userGroup.add(camera);
        scene.add(userGroup);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // 조명 설정
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 20, 10);
        scene.add(dirLight);

        // 환경 가이드 (그리드)
        const grid = new THREE.GridHelper(50, 50, 0x444444, 0xffffff);
        scene.add(grid);

        const loader = new GLTFLoader();
        let currentModel = null;

        // --- WASD 이동 로직 ---
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false };
        const moveVector = new THREE.Vector3();
        const moveSpeed = 0.15;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        function updateMovement() {
            // 카메라가 바라보는 방향 기준 벡터 계산
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            
            // 수평 방향 벡터 (Y축 무시)
            const sideDirection = new THREE.Vector3().crossVectors(camera.up, direction).normalize();

            // 전진/후진 (W, S)
            if (keys.w) userGroup.position.addScaledVector(direction, moveSpeed);
            if (keys.s) userGroup.position.addScaledVector(direction, -moveSpeed);
            
            // 좌우 이동 (A, D)
            if (keys.a) userGroup.position.addScaledVector(sideDirection, moveSpeed);
            if (keys.d) userGroup.position.addScaledVector(sideDirection, -moveSpeed);

            // 상승/하강 (Q, E)
            if (keys.q) userGroup.position.y += moveSpeed;
            if (keys.e) userGroup.position.y -= moveSpeed;
        }
        // -----------------------

        function loadModel(url, isAuto = false) {
            try {
                new URL(url, window.location.href);
            } catch (e) {
                if (!isAuto) {
                    modelStatusEl.innerText = "잘못된 파일 경로입니다.";
                    modelStatusEl.className = "status-error";
                }
                return;
            }

            if (currentModel) scene.remove(currentModel);

            modelStatusEl.innerText = isAuto ? "model.glb 로딩 중..." : "파일 로딩 중...";
            modelStatusEl.className = "status-wait";

            loader.load(url, 
                (gltf) => {
                    currentModel = gltf.scene;
                    
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    
                    if (maxDim > 100) {
                        currentModel.scale.setScalar(2 / maxDim); 
                    } else if (maxDim < 0.01) {
                        currentModel.scale.setScalar(100); 
                    }
                    
                    const newBox = new THREE.Box3().setFromObject(currentModel);
                    const center = newBox.getCenter(new THREE.Vector3());
                    currentModel.position.x -= center.x;
                    currentModel.position.z -= center.z;
                    currentModel.position.y -= newBox.min.y; 
                    currentModel.position.z -= 5; 
                    
                    scene.add(currentModel);
                    
                    modelStatusEl.innerHTML = isAuto ? "model.glb 완료" : "로드 완료";
                    modelStatusEl.className = "status-ok";
                },
                undefined,
                (error) => {
                    console.warn("Load error:", error);
                    if (isAuto) {
                        modelStatusEl.innerText = "자동 로드 실패 (수동 선택 가능)";
                        modelStatusEl.className = "";
                    } else {
                        modelStatusEl.innerText = "파일 로드 에러";
                        modelStatusEl.className = "status-error";
                    }
                }
            );
        }

        // 초기 자동 로드 시도
        try {
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const defaultModelUrl = new URL('model.glb', baseUrl).href;
            loadModel(defaultModelUrl, true);
        } catch (e) {
            modelStatusEl.innerText = "파일을 선택해주세요.";
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                loadModel(url, false);
            }
        });

        // 애니메이션 루프
        renderer.setAnimationLoop(() => {
            // 이동 업데이트
            updateMovement();
            
            renderer.render(scene, camera);
            
            if (renderer.xr.isPresenting) {
                vrStatusEl.innerHTML = "<span class='status-ok'>연결됨 (VR 모드)</span>";
            } else {
                vrStatusEl.innerText = "대기 중";
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
